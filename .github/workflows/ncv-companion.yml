name: NCV Companion CI

on:
  push:
    branches: [main]
    paths:
      - "ncv_companion/**"
      - ".github/workflows/ncv-companion.yml"
  pull_request:
    paths:
      - "ncv_companion/**"
      - ".github/workflows/ncv-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncv-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ncv_companion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod providers
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
