version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pub"
    directory: "/ncv_companion"
    schedule:
      interval: "weekly"
    groups:
      flutter-dependencies:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      android-dependencies:
        patterns: ["*"]
