name: ncv_companion
description: Offline-first companion app for South African NCV Level 2-4 TVET students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & auth (Supabase: Auth, PostgREST, Storage, Edge Functions)
  supabase_flutter: ^2.18.3

  # State management (Riverpod with code generation)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation with auth guards and per-tab navigation stacks
  go_router: ^18.1.0

  # Offline storage (maintained community fork of Hive)
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.4.0

  # Network state (interface-level; repositories also fall back on request failure)
  connectivity_plus: ^7.3.2

  # Offline PDF reading
  flutter_pdfview: ^1.4.5
  path_provider: ^2.1.5

  # Streamed PDF downloads with progress
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
